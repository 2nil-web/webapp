<!DOCTYPE html>
<html>

<head>

    @import url(https://fonts.googleapis.com/css?family=Droid+Serif:400,700,400italic);

    h1,
    h2,

    #d1,
    d2 {
      width: 100%;

    }

    #source {

<body onload="md_load();">
  <div id="d1">
    <textarea id="editable" oninput="mdchg()"></textarea>
  </div>

  <div id="d2">
    <textarea id="source" oninput="mdchg()"></textarea>
  </div>
  <script src="https://remarkjs.com/downloads/remark-latest.min.js"></script>
  <script>
    function getCursorPos(input) {
      if ("selectionStart" in input && document.activeElement == input) {
        return {
          start: input.selectionStart,
          end: input.selectionEnd
        };
      } else if (input.createTextRange) {
        var sel = document.selection.createRange();
        if (sel.parentElement() === input) {
          var rng = input.createTextRange();
          rng.moveToBookmark(sel.getBookmark());
          for (var len = 0; rng.compareEndPoints("EndToStart", rng) > 0; rng.moveEnd("character", -1)) {
            len++;
          }
          rng.setEndPoint("StartToStart", input.createTextRange());
          for (var pos = {
              start: 0,
              end: len
            }; rng.compareEndPoints("EndToStart", rng) > 0; rng.moveEnd("character", -1)) {
            pos.start++;
            pos.end++;
          }
          return pos;
        }
      }
      return -1;
    }

    function setCursorPos(input, start, end) {
      if (arguments.length < 3) end = start;
      if ("selectionStart" in input) {
        setTimeout(function() {
          input.selectionStart = start;
          input.selectionEnd = end;
        }, 1);
      } else if (input.createTextRange) {
        var rng = input.createTextRange();
        rng.moveStart("character", start);
        rng.collapse();
        rng.moveEnd("character", end - start);
        rng.select();
      }
    }


    async function md_load() {
      //console.log(source.innerHTML);
      var mds = await fs.read("example.md");
      //console.log(mds);
      source.innerHTML = mds;
      var slideshow = remark.create({
        source: mds
      });
      editable.value = mds;

      window.addEventListener("keydown", () => {
        document.getElementById("editable").focus()
      });
    }

    function mdchg() {
      var chs = editable.value;
      var slideshow = remark.create({
        source: chs
      });
      editable.value = chs;

      //      source.value=chs;
      //      source.focus(); setCursorPos(source, pos, pos);
    }
  </script>
</body>
